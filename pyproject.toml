[project]
name = "pamss-experiments"
version = "0.1.0"
description = "Perceptually-Adaptive Multiresolution Speculative Sampling experiments"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.25.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "Pillow>=9.5.0",
    "requests>=2.31.0",
    "clip-anytorch>=2.5.0",
    "timm>=0.9.0",
    "safetensors>=0.4.0",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]